                            .toxic-title {
                                color: #ff0000;

                                75% { text-shadow: -2px 2px red, 2px -2px blue; }

            }
            
            // 2. Cek apakah ada yang coba inspect element / buka dev tools
            const originalConsole = console.log;
            console.log = function() {
                // Jika ada yang coba console.log, kasih pesan toxic
                if (arguments.length > 0 && typeof arguments[0] === 'string') {
                    const msg = arguments[0];
                    if (msg.includes('source') || msg.includes('code') || msg.includes('html')) {
                        alert('🖕 JANGAN COBA-COBA CURINYA YA! 🖕\nSource code ini milik YUKI STORE!');
                    }
                }
                originalConsole.apply(console, arguments);
            };
            
            // 3. Cek kanan klik / context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                alert('☠️ MAU COPAS? GAK BISA! ☠️\n\nIni punya YUKI STORE!');
                return false;
            });
            
            // 4. Cek tombol Ctrl+U (View Source), Ctrl+Shift+I (Inspect), F12
            document.addEventListener('keydown', function(e) {
                // Ctrl+U, Ctrl+Shift+I, F12
                if (e.key === 'F12' || 
                    (e.ctrlKey && e.key === 'u') || 
                    (e.ctrlKey && e.shiftKey && e.key === 'i') ||
                    (e.ctrlKey && e.shiftKey && e.key === 'j')) {
                    e.preventDefault();
                    alert('💀 MAU LIAT SOURCE? GAK BISA! 💀\n\nUdah di-encrypt sama YUKI STORE!');

                }
            });

            };
            
            // 7. Cek apakah ada yang coba save page (Ctrl+S)
            document.addEventListener('keydown', function(e) {

            });
            document.addEventListener('drop', function(e) {
